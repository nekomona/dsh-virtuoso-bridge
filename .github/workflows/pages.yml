name: Deploy documentation site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check-site.mjs'
      - 'scripts/check-site-terms.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check-site.mjs'
      - 'scripts/check-site-terms.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and package the static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # The site is plain HTML/CSS/JS; this job installs no dependencies.

      - name: Validate the site (links, anchors, shell, CSS classes)
        run: node scripts/check-site.mjs

      - name: Check that the tool name stays untranslated
        run: node scripts/check-site-terms.mjs

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
