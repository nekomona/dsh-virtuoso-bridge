name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One release run per tag; never cancel a publish that is already in flight.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @nekomona/dsh-virtuoso-bridge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          # No `cache: npm`: this repository has no lockfile and installs no dependencies.

      - name: Verify the submodule matches virtuoso-bridge-lite.pin.json
        run: node scripts/prepare-vendor.mjs --verify-only

      - name: Check tracked files for private data
        run: node scripts/check-no-private-data.mjs

      - name: Syntax-check JavaScript entry points
        run: |
          set -euo pipefail
          node --check index.js
          node --check client.js
          for file in lib/*.js; do
            node --check "$file"
          done

      - name: Run the unit tests
        run: node --test tests/*.test.mjs

      - name: Byte-compile Python runtime helpers
        run: |
          set -euo pipefail
          python3 -m py_compile runtime/*.py

      - name: Verify provenance pin parses and matches submodule HEAD
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')
          const pin = JSON.parse(readFileSync('virtuoso-bridge-lite.pin.json', 'utf8'))
          for (const field of ['name', 'version', 'commit', 'commitDate', 'repository', 'submodulePath']) {
            if (typeof pin[field] !== 'string' || pin[field] === '') {
              throw new Error('virtuoso-bridge-lite.pin.json field ' + field + ' is missing or empty')
            }
          }
          const head = execFileSync('git', ['-C', 'virtuoso-bridge-lite', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          if (pin.commit !== head) {
            throw new Error('virtuoso-bridge-lite.pin.json commit ' + pin.commit + ' does not match submodule HEAD ' + head)
          }
          console.log('virtuoso-bridge-lite.pin.json OK: ' + pin.name + ' ' + pin.version + ' @ ' + pin.commit + ' (' + pin.commitDate + ')')
          NODE

      - name: Assert the release tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version (expected $expected)."
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME matches package.json version $version"

      - name: Decide whether npm publish is still needed
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          package="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not configured; skipping npm publish. Add the repository secret to publish from CI, or publish the tarball manually."
            echo "publish=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is already on npm; skipping npm publish and continuing with the GitHub release."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.publish == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Pack the tarball for the GitHub release asset
        id: pack
        run: |
          set -euo pipefail
          filename="$(npm pack --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=/^\[$/m.exec(s);if(!m){console.error("npm pack --json did not print a JSON array");process.exit(1)}const t=JSON.parse(s.slice(m.index));if(t.length!==1){console.error("expected exactly one tarball, got "+t.length);process.exit(1)}process.stdout.write(t[0].filename)})')"
          test -f "$filename"
          echo "tarball=$filename" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
